<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="katex.min.css">
<style>
html,body { margin:0; padding:0; background:transparent; color:#284852; font:14px/1.55 -apple-system,BlinkMacSystemFont,sans-serif; overflow:hidden; }
#content { display:flow-root; overflow-wrap:anywhere; }
#content > :first-child { margin-top:0; } #content > :last-child { margin-bottom:0; }
p,ul,ol,blockquote,pre,table { margin:0 0 10px; }
ul,ol { padding-left:24px; } li p { margin-bottom:4px; }
h1,h2,h3,h4,h5,h6 { line-height:1.3; margin:14px 0 8px; } h1 { font-size:22px; } h2 { font-size:19px; } h3 { font-size:16px; }
a { color:#007175; text-decoration:underline; }
blockquote { border-left:3px solid #91b6b0; padding-left:10px; }
code { font:12px/1.5 ui-monospace,monospace; background:#ffffff70; border-radius:4px; padding:2px 4px; }
pre { overflow-x:auto; padding:10px; background:#ffffff70; border-radius:6px; } pre code { background:none; padding:0; white-space:pre; }
table { display:block; overflow-x:auto; border-collapse:collapse; } th,td { border:1px solid #a9c6c1; padding:6px 9px; }
.katex-display { overflow-x:auto; overflow-y:hidden; padding:3px 0; margin:10px 0; } .katex { font-size:1.08em; }
.math-fallback { white-space:pre-wrap; } hr { border:0; border-top:1px solid #a9c6c1; }
</style></head><body><main id="content"></main>
<script src="markdown-it.min.js"></script><script src="katex.min.js"></script><script src="renderer.js"></script>
</body></html>
